name: Paper release

on:
  push:
    branches: [main]

concurrency:
  group: paper-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy:
    name: release / public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Validate public release policy
        run: python scripts/check_public_release.py
  tex-en:
    name: release / English PDF
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/en
          args: -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Reject unresolved references and citations
        run: '! grep -E "Undefined (references|citations)|Rerun to get" paper/en/main.log'
      - name: Stage uniquely named English release PDF
        run: |
          mkdir -p release-assets
          cp paper/en/main.pdf release-assets/learnable-sde-paper-en.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: paper-en-release-${{ github.sha }}
          path: release-assets/learnable-sde-paper-en.pdf
          if-no-files-found: error
          retention-days: 14
  tex-zh:
    name: release / Chinese PDF
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/zh
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Reject unresolved references and citations
        run: '! grep -E "Undefined (references|citations)|Rerun to get" paper/zh/main.log'
      - name: Stage uniquely named Chinese release PDF
        run: |
          mkdir -p release-assets
          cp paper/zh/main.pdf release-assets/learnable-sde-paper-zh.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: paper-zh-release-${{ github.sha }}
          path: release-assets/learnable-sde-paper-zh.pdf
          if-no-files-found: error
          retention-days: 14
  publish:
    name: release / publish immutable PDFs
    needs: [tex-en, tex-zh]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paper-en-release-${{ github.sha }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: paper-zh-release-${{ github.sha }}
          path: release-assets
      - name: Verify complete bilingual asset set and generate checksums
        run: |
          test -s release-assets/learnable-sde-paper-en.pdf
          test -s release-assets/learnable-sde-paper-zh.pdf
          (cd release-assets && sha256sum learnable-sde-paper-en.pdf learnable-sde-paper-zh.pdf > SHA256SUMS)
      - name: Reserve a new immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="paper-release-${GITHUB_SHA::12}"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing Release: $release_tag" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag: $release_tag" >&2
            exit 1
          fi
      - name: Publish bilingual PDF assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Paper release $RELEASE_TAG" \
            --notes "Built automatically from the commit merged into main: $GITHUB_SHA." \
            release-assets/learnable-sde-paper-en.pdf \
            release-assets/learnable-sde-paper-zh.pdf \
            release-assets/SHA256SUMS
          {
            echo "## Paper release published"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Assets: English PDF, Chinese PDF, SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"
