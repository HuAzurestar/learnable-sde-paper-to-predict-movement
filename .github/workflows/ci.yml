name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy / traceability and public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Explain policy validation
        run: |
          {
            echo "## Policy gate"
            echo "Validates PR traceability and rejects non-public artifacts or identifiers."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate PR traceability
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python scripts/check_pr_title.py "$PR_TITLE" "$PR_BRANCH"
      - name: Public release scan
        run: python scripts/check_public_release.py
  evidence:
    name: test / shared evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - run: python -B scripts/pirc26_package.py --check
  tex-en:
    name: tex / English PDF and references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Explain English PDF validation
        run: |
          {
            echo "## English paper gate"
            echo "Builds the English PDF and fails on unresolved references or citations."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/en
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Reject unresolved references and citations
        run: '! grep -E "Undefined (references|citations)|Rerun to get" paper/en/main.log'
      - uses: actions/upload-artifact@v4
        with:
          name: paper-en-${{ github.sha }}
          path: paper/en/main.pdf
          retention-days: 7
  tex-zh:
    name: tex / Chinese PDF and references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Explain Chinese PDF validation
        run: |
          {
            echo "## Chinese paper gate"
            echo "Builds the Chinese PDF and fails on unresolved references or citations."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/zh
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Reject unresolved references and citations
        run: '! grep -E "Undefined (references|citations)|Rerun to get" paper/zh/main.log'
      - uses: actions/upload-artifact@v4
        with:
          name: paper-zh-${{ github.sha }}
          path: paper/zh/main.pdf
          retention-days: 7
  pirc26-en:
    name: tex / PIRC-26 English report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/pirc26/en
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - run: '! grep -E "Undefined (references|citations)|Rerun to get|undefined on input line" paper/pirc26/en/main.log'
      - uses: actions/upload-artifact@v4
        with:
          name: pirc26-en-${{ github.sha }}
          path: paper/pirc26/en/main.pdf
          retention-days: 7
  pirc26-zh:
    name: tex / PIRC-26 Chinese report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper/pirc26/zh
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error
      - run: '! grep -E "Undefined (references|citations)|Rerun to get|undefined on input line" paper/pirc26/zh/main.log'
      - uses: actions/upload-artifact@v4
        with:
          name: pirc26-zh-${{ github.sha }}
          path: paper/pirc26/zh/main.pdf
          retention-days: 7
  required:
    name: ci / required
    if: ${{ always() }}
    needs: [policy, evidence, tex-en, tex-zh, pirc26-en, pirc26-zh]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain required-check result
        run: |
          {
            echo "## Required gate"
            echo "Passes only when policy, shared evidence, and both PDF gates succeed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful gates
        env:
          POLICY: ${{ needs.policy.result }}
          EVIDENCE: ${{ needs.evidence.result }}
          TEX_EN: ${{ needs.tex-en.result }}
          TEX_ZH: ${{ needs.tex-zh.result }}
          PIRC26_EN: ${{ needs.pirc26-en.result }}
          PIRC26_ZH: ${{ needs.pirc26-zh.result }}
        run: test "$POLICY" = success && test "$EVIDENCE" = success && test "$TEX_EN" = success && test "$TEX_ZH" = success && test "$PIRC26_EN" = success && test "$PIRC26_ZH" = success
